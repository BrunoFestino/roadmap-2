# Jira credentials are supplied at runtime. Do not commit a token.
jira.base-url=${JIRA_BASE_URL}
jira.token=${JIRA_TOKEN}
jira.project=${JIRA_PROJECT:TTAR}
jira.connect-timeout=10s
jira.read-timeout=30s

server.port=${SERVER_PORT:8082}
vaadin.launch-browser=${VAADIN_LAUNCH_BROWSER:false}

# PostgreSQL is reached through an SSH tunnel by default. The database password must be
# supplied at runtime and must never be committed.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/roadmap}
spring.datasource.username=${DB_USER:bruno}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

logging.level.com.sicpa.roadmap=INFO