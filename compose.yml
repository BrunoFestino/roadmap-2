services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ROADMAP_DB_NAME:-roadmap}
      POSTGRES_USER: ${ROADMAP_DB_USERNAME:?ROADMAP_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${ROADMAP_DB_PASSWORD:?ROADMAP_DB_PASSWORD is required}
    volumes:
      - roadmap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  roadmap:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ROADMAP_DB_HOST: postgres
      ROADMAP_DB_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ROADMAP_SERVER_PORT:-8082}:${ROADMAP_SERVER_PORT:-8082}"

volumes:
  roadmap-postgres-data:
