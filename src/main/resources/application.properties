# Jira connection and instance-specific custom field IDs.
roadmap.jira.base-url=${ROADMAP_JIRA_BASE_URL}
roadmap.jira.token=${ROADMAP_JIRA_TOKEN}
roadmap.jira.project=${ROADMAP_JIRA_PROJECT:TTAR}
roadmap.jira.connect-timeout=${ROADMAP_JIRA_CONNECT_TIMEOUT:10s}
roadmap.jira.read-timeout=${ROADMAP_JIRA_READ_TIMEOUT:30s}
roadmap.jira.field-effort-estimate=${ROADMAP_JIRA_FIELD_EFFORT_ESTIMATE:customfield_14230}
roadmap.jira.field-epic-link=${ROADMAP_JIRA_FIELD_EPIC_LINK:customfield_10830}
roadmap.jira.field-target-start=${ROADMAP_JIRA_FIELD_TARGET_START:customfield_12832}
roadmap.jira.field-first-time-in-progress=${ROADMAP_JIRA_FIELD_FIRST_TIME_IN_PROGRESS:customfield_13034}

# Team members use username|display name|role, separated by commas. Stack aliases are
# comma-separated Jira labels. Both are validated during startup.
roadmap.team.members=${ROADMAP_TEAM_MEMBERS:bfestino|Bruno Festino|MOBILE,dgillig|David Gillig|MOBILE,agrigaliun|Agustin Grigaliunas|BACKEND,mbazante|Mauro Bazante|FRONTEND,tarteaga|Tony Arteaga|BACKEND,sreza1|Juan Sebastian Reza|BACKEND,mmendoza|Mateo Mendoza|BACKEND,sbenalcaza|Sebastian Benalcazar|BACKEND,rdente|Rodrigo Dente|DEVOPS}
roadmap.stack-aliases.frontend=${ROADMAP_STACK_ALIASES_FRONTEND:front,frontend,front end,stack front,stack frontend}
roadmap.stack-aliases.backend=${ROADMAP_STACK_ALIASES_BACKEND:be,backend,back end,stack be,stack backend}
roadmap.stack-aliases.mobile=${ROADMAP_STACK_ALIASES_MOBILE:mobile,stack mobile}
roadmap.stack-aliases.devops=${ROADMAP_STACK_ALIASES_DEVOPS:devops,dev ops,stack devops}

server.port=${ROADMAP_SERVER_PORT:8082}
vaadin.launch-browser=${ROADMAP_VAADIN_LAUNCH_BROWSER:false}

# PostgreSQL is reached through an SSH tunnel by default. The database password must be
# supplied at runtime and must never be committed.
spring.datasource.url=${ROADMAP_DB_URL:jdbc:postgresql://${ROADMAP_DB_HOST:127.0.0.1}:${ROADMAP_DB_PORT:5433}/${ROADMAP_DB_NAME:roadmap}}
spring.datasource.username=${ROADMAP_DB_USERNAME}
spring.datasource.password=${ROADMAP_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${ROADMAP_DB_POOL_SIZE:5}

logging.level.com.example.roadmap=${ROADMAP_LOG_LEVEL:INFO}
